<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منيو مزاز الرقمي | Mazaz Juice & Food Menu</title>

    <!-- Meta Data & SEO -->
    <meta name="description"
        content="منيو مزاز الإلكتروني - تصفح أشهى العصائر الطبيعية والخلطات والوجبات السريعة والميلك شيك من محل مزاز (Mazaz) بأسعار وعروض متجددة.">
    <meta name="keywords"
        content="مزاز, عصائر مزاز, وجبات سريعة, منيو مزاز, عصير عوار قلب, اصفهاني, ساندوتشات, Mazaz Menu">
    <meta name="author" content="Mazaz Team">
    <meta name="theme-color" content="#00A651">

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="منيو مزاز الرقمي | Mazaz Menu">
    <meta property="og:description" content="تصفح منيو عصائر ووجبات مزاز الإلكتروني واستمتع بالطعم المذهل.">
    <meta property="og:image" content="../assets/logo.jpg">
    <meta property="og:locale" content="ar_SA">

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="../assets/logo.jpg">
    <link rel="apple-touch-icon" href="../assets/logo.jpg">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Tajawal) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- App Header & Hero Banner -->
    <header class="hero-header">
        <div class="hero-overlay"></div>
        <div class="container hero-content">
            <div class="brand-badge">
                <img src="assets/logo.svg" alt="مزاز Mazaz" class="menu-logo">
                <div class="brand-text">
                    <h1>منيو مزاز الرقمي | MAZAZ</h1>
                    <p><i class="fa-solid fa-store"></i> طعم العصير الحقيقي والوجبات السريعة</p>
                </div>
            </div>

            <!-- Compact Responsive Quick Paper Menu Bar (المنيو 1 والمنيو 2) -->
            <div class="compact-menu-bar">
                <div class="compact-menu-item" onclick="openMenuViewer('../assets/menu1.jpg', 'المنيو 1 - عصائر وميلك شيك')">
                    <div class="compact-item-icon">
                        <i class="fa-solid fa-glass-water"></i>
                    </div>
                    <div class="compact-item-details">
                        <strong>المنيو 1 (عصائر)</strong>
                        <span>استعراض الصورة</span>
                    </div>
                    <a href="../assets/menu1.jpg" download="Mazaz_Menu_1.jpg" class="compact-dl-btn" title="تحميل صورة" onclick="event.stopPropagation()">
                        <i class="fa-solid fa-download"></i>
                    </a>
                </div>

                <div class="compact-menu-item" onclick="openMenuViewer('../assets/menu2.jpg', 'المنيو 2 - وجبات وحلا ومشروبات')">
                    <div class="compact-item-icon">
                        <i class="fa-solid fa-burger"></i>
                    </div>
                    <div class="compact-item-details">
                        <strong>المنيو 2 (وجبات)</strong>
                        <span>استعراض الصورة</span>
                    </div>
                    <a href="../assets/menu2.jpg" download="Mazaz_Menu_2.jpg" class="compact-dl-btn" title="تحميل صورة" onclick="event.stopPropagation()">
                        <i class="fa-solid fa-download"></i>
                    </a>
                </div>
            </div>

            <!-- Quick Search Input -->
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن عصير، وجبة، أو إضافة...">
                <button id="clearSearchBtn" class="clear-btn" style="display: none;">&times;</button>
            </div>
        </div>
    </header>

    <!-- Categories Navigation Bar (Sticky Horizontal Scroll) -->
    <nav class="categories-nav-wrapper">
        <div class="container">
            <div class="categories-scroll" id="categoriesNav">
                <button class="cat-pill active" data-id="all">
                    <i class="fa-solid fa-fire"></i> الكل
                </button>
                <!-- Categories Pinned Dynamically -->
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="container menu-main">
        <!-- Menu Categories & Items Sections -->

        <!-- Menu Categories & Items Sections -->
        <div id="menuContainer" class="menu-container">
            <!-- Loading Skeleton Cards -->
            <div class="loading-spinner-wrapper">
                <div class="spinner"></div>
                <p>جاري تحضير أشهى المأكولات والعصائر...</p>
            </div>
        </div>
    </main>

    <!-- Product Details Modal (Product Info + Addons) -->
    <div class="modal" id="productDetailModal">
        <div class="modal-content text-right">
            <button class="close-btn" id="closeModalBtn">&times;</button>
            <div class="modal-body" id="modalProductDetails">
                <!-- Dynamically Populated -->
            </div>
        </div>
    </div>

    <!-- Full-Screen Interactive Menu Image Viewer Modal (Zoom + Download) -->
    <div class="image-viewer-modal" id="imageViewerModal">
        <div class="image-viewer-header">
            <h3 id="viewerTitle">منيو مزاز</h3>
            <div class="viewer-actions">
                <button class="viewer-btn" id="zoomInBtn" title="تكبير الصورة"><i
                        class="fa-solid fa-magnifying-glass-plus"></i></button>
                <button class="viewer-btn" id="zoomOutBtn" title="تصغير الصورة"><i
                        class="fa-solid fa-magnifying-glass-minus"></i></button>
                <a class="viewer-btn download-link" id="downloadImageBtn" download="Mazaz_Menu.jpg"
                    title="تحميل الصورة للهاتف"><i class="fa-solid fa-download"></i> تحميل الصورة</a>
                <button class="viewer-btn close-viewer" id="closeViewerBtn">&times;</button>
            </div>
        </div>
        <div class="image-viewer-body" id="imageViewerBody">
            <img src="" alt="منيو مزاز" id="viewerImage" class="viewer-img">
        </div>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <img src="assets/logo.svg" alt="مزاز" class="footer-logo">
                <p>جميع الحقوق محفوظة © محل مزاز MAZAZ 2026</p>
            </div>
            <div class="developer-credit">
                <span>برمجة وتطوير: </span>
                <a href="https://wa.me/967770985114" target="_blank" rel="noopener" class="dev-link" title="تواصل عبر الواتساب">
                    <i class="fa-brands fa-whatsapp"></i> م.أحمد العطاس
                </a>
            </div>
        </div>
    </footer>

    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <script src="app.js"></script>
</body>

</html>
